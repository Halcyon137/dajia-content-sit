name: Fetch site data

on:
  workflow_dispatch:
  schedule:
    # 每天 3 个低频运行窗口；窗口内再随机延迟，分散服务器负载
    - cron: '0 1,9,17 * * *'

concurrency:
  group: content-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Add load-spreading delay
        run: |
          delay=$((RANDOM % 5400))
          echo "Waiting ${delay}s before the scheduled fetch"
          sleep "$delay"
      - run: node scrape.js
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: refresh site data"
          git push
