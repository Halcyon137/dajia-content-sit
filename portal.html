<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大佳 · 会员内容平台</title><style>
:root{--ink:#202124;--muted:#78807b;--paper:#f8f6f1;--line:#e5e1d9;--accent:#c85b3f;--green:#376b58;--dark:#202b28}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 42px;background:#fbfaf7}.logo{display:flex;align-items:center;gap:11px}.logo-mark{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}.logo strong{font-family:Georgia,serif;font-size:21px}.logo small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}.page{max-width:1180px;margin:auto;padding:44px 32px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.hero h1{font:500 44px/1.1 Georgia,serif;margin:0 0 10px}.hero p{margin:0;color:var(--muted)}.date{font:18px Georgia,serif;color:var(--accent)}.content{display:grid;grid-template-columns:1fr 300px;gap:42px}.feed{border-top:2px solid var(--ink)}.entry{padding:24px 0;border-bottom:1px solid var(--line)}.meta{font-size:13px;color:var(--muted);margin-bottom:12px}.entry h2{font:500 24px Georgia,serif;margin:0 0 12px}.entry p{font:16px/1.9 Georgia,serif;color:#4f514d;margin:0;max-width:720px}.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;margin-top:14px}.file b{flex:1;font-size:13px}.file span{font-size:12px;color:var(--muted)}.side{border-left:1px solid var(--line);padding-left:24px}.side h3{font-size:12px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.side-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:13px 0;font-size:14px}.auth-wrap{max-width:440px;margin:70px auto}.auth-wrap h1{font:500 40px Georgia,serif;margin:0 0 10px}.auth-wrap>p{color:var(--muted);margin-bottom:28px}.form{background:#fff;border:1px solid var(--line);padding:28px;border-radius:18px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 13px;outline:none}.hint{color:var(--muted);font-size:12px;line-height:1.6}.form .btn{width:100%;margin-top:8px}.switch{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}.link{color:var(--accent);cursor:pointer}.member{background:var(--dark);color:#fff;border-radius:18px;padding:22px 25px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.member small{color:#b9c6bf}.member strong{display:block;font-size:21px;margin-top:4px}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.plan{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;position:relative}.plan.recommend{border:2px solid var(--accent)}.plan .badge{position:absolute;right:14px;top:14px;color:var(--accent);font-size:11px}.plan h3{font:500 19px Georgia,serif;margin:0 0 11px}.price{font-size:28px;font-weight:700}.per{font-size:12px;color:var(--muted);margin-top:3px}.plan .btn{width:100%;margin-top:18px}.pay{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px;gap:26px;align-items:center}.pay.show{display:flex}.qr{width:150px;height:150px;background:repeating-conic-gradient(#252525 0 25%,#fff 0 50%) 0/17px 17px;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}.pay h3{margin:0 0 8px}.pay p{color:var(--muted);font-size:13px}.admin{background:#18211f;color:#eef5f0;min-height:calc(100vh - 72px);padding:36px 42px}\.admin-grid{max-width:1180px;margin:auto}\.admin h1{font:500 36px Georgia,serif}..stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:#24332f;border:1px solid #344740;border-radius:13px;padding:17px}.stat span{display:block;color:#a9bbb2;font-size:12px}.stat b{display:block;font-size:27px;margin-top:8px}.table{background:#24332f;border:1px solid #344740;border-radius:13px;overflow:hidden}.tr{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1fr .8fr;padding:15px 18px;border-bottom:1px solid #344740;font-size:13px}.tr.head{color:#a9bbb2;font-size:12px}.status{color:#e7b36b}.add-plan{background:none;border:0;cursor:pointer;font:inherit}.hidden{display:none!important}@media(max-width:850px){.top{padding:0 18px}.page{padding:28px 18px}.content{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}.plans,.stats{grid-template-columns:1fr 1fr}.hero{display:block}.date{margin-top:20px}.admin{padding:25px 18px}.tr{grid-template-columns:1fr 1fr;gap:8px}.tr.head{display:none}}
</style></head><body><div class="app" id="app"></div><script>
const sample=[{time:'今天 02:54',title:'2026-11-16，股票市场。（数据部分）',text:'今晚美股下跌，主要是半导体带动的科技股集体回调。硬件再次遭受重创，软件也不乐观。',file:'20261116-股票市场数据.pdf',size:'4.8 MB'},{time:'昨天 21:47',title:'2026-11-16，股票市场。（数据部分）',text:'市场整体调整，创业板指盘中一度跌超 4%，沪指盘中跌破 3600 点关口。',file:'2026-11-16-行情摘要.docx',size:'286 KB'}];let isAdmin=location.hash==='#admin'||new URLSearchParams(location.search).get('admin')==='1'; let view=isAdmin?'admin':'login';
function header(){return `<header class="top"><div class="logo"><div class="logo-mark">大</div><div><strong>大佳</strong><small>内容会员平台</small></div></div><div class="top-actions"><button class="btn" onclick="show('content')">内容首页</button><button class="btn dark" style="${isAdmin?'': 'display:none'}" onclick="show('admin')">管理后台</button></div></header>`}
function show(v){if(v==='content'&&!localStorage.getItem('memberPlan')){view='member';render();alert('请先完成订阅或等待管理员开通会员');return}view=v;render()}
function render(){const a=document.querySelector('#app');if(view==='login')return a.innerHTML=header()+`<main class="auth-wrap"><h1>欢迎回来</h1><p>登录后查看授权内容与文件</p><div class="form"><div class="field"><label>用户名</label><input placeholder="英文字母 + 数字"></div><div class="field"><label>登录密码</label><input type="password" placeholder="请输入密码"></div><button class="btn primary" onclick="show('member')">登录</button><div class="switch"><span class="link" onclick="show('register')">注册账号</span>　·　<span class="link" onclick="show('forgot')">忘记密码</span></div></div></main>`;if(view==='register')return a.innerHTML=header()+`<main class="auth-wrap"><h1>创建账号</h1><p>注册后可体验内容服务</p><div class="form"><div class="field"><label>用户名</label><input placeholder="仅限英文字母和数字"></div><div class="field"><label>登录密码</label><input type="password" placeholder="大小写 + 数字 + 特殊字符"></div><div class="field"><label>确认密码</label><input type="password"></div><div class="field"><label>手机号</label><input placeholder="一个手机号仅限注册一次"></div><div class="field"><label>邮箱</label><input type="email" placeholder="用于找回密码和到期提醒"></div><button class="btn primary" onclick="show('member')">注册并继续</button><div class="switch">已有账号？<span class="link" onclick="show('login')">返回登录</span></div></div></main>`;if(view==='forgot')return a.innerHTML=header()+`<main class="auth-wrap"><h1>找回密码</h1><p>通过注册邮箱重置登录密码</p><div class="form"><div class="field"><label>注册邮箱</label><input type="email" placeholder="name@example.com"></div><button class="btn primary" onclick="alert('重置邮件已发送（原型演示）')">发送重置邮件</button><div class="switch"><span class="link" onclick="show('login')">返回登录</span></div></div></main>`;if(view==='member')return a.innerHTML=header()+`<main class="page"><div class="member"><div><small>会员状态</small><strong>未订阅 · 订阅后查看完整内容</strong></div><span>选择适合你的方案</span></div><div class="plans"><div class="plan"><h3>新人体验</h3><div class="price">¥0.10</div><div class="per">7天 · 约 ¥0.014/天</div><button class="btn" onclick="pay('新人体验 ¥0.10 / 7天')">选择体验</button></div><div class="plan"><h3>月套餐</h3><div class="price">¥8</div><div class="per">30天 · 约 ¥0.27/天</div><button class="btn" onclick="pay('月套餐 ¥8 / 30天')">选择套餐</button></div><div class="plan"><h3>季度套餐</h3><div class="price">¥15</div><div class="per">90天 · 约 ¥0.17/天</div><button class="btn" onclick="pay('季度套餐 ¥15 / 90天')">选择套餐</button></div><div class="plan recommend"><span class="badge">推荐</span><h3>年套餐</h3><div class="price">¥29.90</div><div class="per">365天 · 约 ¥0.08/天</div><button class="btn primary" onclick="pay('年套餐 ¥29.90 / 365天')">选择套餐</button></div></div><div class="pay" id="pay"><div><h3 id="pay-title">选择套餐后付款</h3><p>请选择支付方式，系统将显示对应收款二维码。</p><div class="top-actions"><button class="btn" onclick="payMethod('支付宝')">支付宝</button><button class="btn" onclick="payMethod('微信支付')">微信支付</button></div><div class="qr" id="qr"></div><p id="pay-method">尚未选择支付方式</p><button class="btn dark" onclick="document.querySelector('#pending').classList.remove('hidden')">我已完成付款</button><p id="pending" class="status hidden">已提交人工确认，请等待管理员开通会员。</p></div></div></main>`;if(view==='content')return a.innerHTML=header()+`<main class="page"><div class="hero"><div><h1>最新内容</h1><p>文字与文件，按发布时间整理归档</p></div><div class="date">2026 / 11 / 18</div></div><div class="content"><section class="feed">${sample.map(x=>`<article class="entry"><div class="meta">${x.time} · 看多君</div><h2>${x.title}</h2><p>${x.text}</p><div class="file"><b>${x.file}</b><span>${x.size}</span><span class="link">下载</span></div></article>`).join('')}</section><aside class="side"><h3>会员信息</h3><div class="side-row"><b>当前套餐</b><span>年套餐</span></div><div class="side-row"><b>剩余天数</b><span>362 天</span></div><div class="side-row"><b>到期日期</b><span>2027/11/15</span></div><div class="side-row"><b>状态</b><span style="color:var(--green)">有效</span></div></aside></div></main>`;return a.innerHTML=header()+`<main class="admin"><div class="admin-grid"><h1>管理后台</h1><div class="stats"><div class="stat"><span>用户总数</span><b>128</b></div><div class="stat"><span>有效会员</span><b>86</b></div><div class="stat"><span>待确认订单</span><b>4</b></div><div class="stat"><span>7天内到期</span><b>9</b></div></div><div class="table"><div class="tr head"><span>用户名</span><span>邮箱</span><span>套餐</span><span>到期时间</span><span>操作</span></div><div class="tr"><span>muc2026</span><span>muc@example.com</span><span>年套餐</span><span>2027/11/15</span><span class="status">有效</span></div><div class="tr"><span>alan009</span><span>alan@example.com</span><span>待确认</span><span>—</span><span class="status">确认付款</span></div><div class="tr"><span>test_user</span><span>test@example.com</span><span>已过期</span><span>2026/11/10</span><button class="status add-plan" onclick="addPlan('test_user')">添加套餐</button></div></div></div></main>`}
function addPlan(user){const plan=prompt('为 '+user+' 添加套餐：请输入 新人体验、月套餐、季度套餐 或 年套餐');if(plan){localStorage.setItem('memberPlan',plan);alert('已为 '+user+' 添加 '+plan+'，该用户现在可以查看内容（原型演示）')}} function pay(name){document.querySelector('#pay').classList.add('show');document.querySelector('#pay-title').textContent=name;document.querySelector('#pay').scrollIntoView({behavior:'smooth'})}render();
</script><script src="admin-actions.js"></script></body></html>
